server:
  port: 8080

spring:
  application:
    name: tvmaze-middleware
  data:
    mongodb:
      uri: ${MONGO_URI}
      database: tvmaze

tvmaze:
  base-url: https://api.tvmaze.com
  timeout:
    connect-ms: 5000
    read-seconds: 10
    comment-lookup-seconds: 2
  retry:
    backoff-ms: 200
    retryMaxAttempts: 2
  concurrency:
    search-comments: 8

logging:
  level:
    com.api.tvmaze: DEBUG
    org.springframework.web.reactive.function.client: INFO